name: "\U0001F4A1 Feature Request"
description: Suggest an enhancement or new feature
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please fill out the form below.

        **Please suggest only one enhancement per issue.** If you have several ideas, open a separate request for each — it makes them much easier to consider and track independently.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What's the use case, or what's currently difficult or impossible to do?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
      description: Describe the feature or change you'd like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (optional)
      description: Any other approaches you've thought about?
    validations:
      required: false
