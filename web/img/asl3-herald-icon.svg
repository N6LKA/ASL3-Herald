<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- asl3-herald mark: a wide-based pyramidal lattice tower (classic radio
       tower silhouette) flying a herald's pennant, topped with a beam
       (Yagi) antenna laying flat. -->

  <!-- ground anchor -->
  <line x1="52" y1="212" x2="188" y2="212" stroke="#b8834a" stroke-width="7" stroke-linecap="round"/>

  <!-- tower legs (wide base, converging to a point at top) -->
  <line x1="60" y1="212" x2="120" y2="50" stroke="#b8834a" stroke-width="7" stroke-linecap="round"/>
  <line x1="180" y1="212" x2="120" y2="50" stroke="#b8834a" stroke-width="7" stroke-linecap="round"/>

  <!-- tower rungs -->
  <line x1="66"  y1="190" x2="174" y2="190" stroke="#96632f" stroke-width="4" stroke-linecap="round"/>
  <line x1="77"  y1="165" x2="163" y2="165" stroke="#96632f" stroke-width="4" stroke-linecap="round"/>
  <line x1="87"  y1="140" x2="153" y2="140" stroke="#96632f" stroke-width="4" stroke-linecap="round"/>
  <line x1="96"  y1="115" x2="144" y2="115" stroke="#96632f" stroke-width="4" stroke-linecap="round"/>
  <line x1="106" y1="90"  x2="134" y2="90"  stroke="#96632f" stroke-width="4" stroke-linecap="round"/>

  <!-- tower cross-bracing (one X per panel, corners paired within the same panel) -->
  <line x1="60"  y1="212" x2="174" y2="190" stroke="#96632f" stroke-width="3" stroke-linecap="round"/>
  <line x1="180" y1="212" x2="66"  y2="190" stroke="#96632f" stroke-width="3" stroke-linecap="round"/>

  <line x1="66"  y1="190" x2="163" y2="165" stroke="#96632f" stroke-width="3" stroke-linecap="round"/>
  <line x1="174" y1="190" x2="77"  y2="165" stroke="#96632f" stroke-width="3" stroke-linecap="round"/>

  <line x1="77"  y1="165" x2="153" y2="140" stroke="#96632f" stroke-width="3" stroke-linecap="round"/>
  <line x1="163" y1="165" x2="87"  y2="140" stroke="#96632f" stroke-width="3" stroke-linecap="round"/>

  <line x1="87"  y1="140" x2="144" y2="115" stroke="#96632f" stroke-width="3" stroke-linecap="round"/>
  <line x1="153" y1="140" x2="96"  y2="115" stroke="#96632f" stroke-width="3" stroke-linecap="round"/>

  <line x1="96"  y1="115" x2="134" y2="90" stroke="#96632f" stroke-width="3" stroke-linecap="round"/>
  <line x1="144" y1="115" x2="106" y2="90" stroke="#96632f" stroke-width="3" stroke-linecap="round"/>

  <line x1="106" y1="90" x2="120" y2="50" stroke="#96632f" stroke-width="3" stroke-linecap="round"/>
  <line x1="134" y1="90" x2="120" y2="50" stroke="#96632f" stroke-width="3" stroke-linecap="round"/>

  <!-- herald's pennant (swallowtail), mounted on the tower's upper section -->
  <path d="M144 92 L204 106 L184 118 L204 130 L144 144 Z" fill="#59d98c"/>

  <!-- antenna mount mast -->
  <line x1="120" y1="50" x2="120" y2="38" stroke="#b8834a" stroke-width="5" stroke-linecap="round"/>

  <!-- beam (Yagi) antenna, laying flat: long horizontal boom, short elements -->
  <line x1="50" y1="32" x2="190" y2="32" stroke="#59d98c" stroke-width="4" stroke-linecap="round"/>
  <line x1="58"  y1="16" x2="58"  y2="48" stroke="#59d98c" stroke-width="5" stroke-linecap="round"/>
  <line x1="84"  y1="19" x2="84"  y2="45" stroke="#59d98c" stroke-width="5" stroke-linecap="round"/>
  <line x1="110" y1="21" x2="110" y2="43" stroke="#59d98c" stroke-width="5" stroke-linecap="round"/>
  <line x1="136" y1="23" x2="136" y2="41" stroke="#59d98c" stroke-width="5" stroke-linecap="round"/>
  <line x1="162" y1="25" x2="162" y2="39" stroke="#59d98c" stroke-width="5" stroke-linecap="round"/>
  <line x1="184" y1="27" x2="184" y2="37" stroke="#59d98c" stroke-width="5" stroke-linecap="round"/>
</svg>
